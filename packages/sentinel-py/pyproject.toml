[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-security"
version = "0.1.0"
description = "Zero-dependency security assessment, reconnaissance, and pentest toolkit"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["security", "pentest", "vulnerability-scanner", "jwt", "cors", "reconnaissance"]
authors = [
    { name = "Sentinel Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security",
]

[project.scripts]
sentinel-py = "sentinel:main"
sentinel-pentest = "sentinel:main"
